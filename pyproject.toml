[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "apexos-fantasy-gm"
version = "0.1.0"
description = "Local-first, league-aware fantasy football decision system."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27,<0.29",
    "pyarrow>=19,<25",
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
weekly = [
    "pandas>=3.0,<4",
    "numpy>=2.2,<3",
    "scipy>=1.14,<2",
    "pulp>=3.0,<4",
    "openpyxl>=3.1",
    "lxml>=5",
    "pdfplumber>=0.11",
    "requests>=2.31",
]

[project.scripts]
apex-weekly = "engine.weekly.cli:main"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["tests/acceptance"]
addopts = "-q"
