name: Issue #23 live-state-consumer acceptance tests

on:
  pull_request:
    branches: [main]
    paths:
      - engine/draft/live_state_consumer.py
      - tests/acceptance/test_live_state_consumer.py
      - engine/contracts/draft_seat_assignment.py
      - engine/draft/round_order_map.py
      - engine/draft_state/**
      - contracts/draft/spamml-2026-draft-seat-assignment-v1.1.yaml
      - contracts/league_rules/spamml-2026-v0.5.yaml
      - .github/workflows/issue23-live-state-consumer.yml
  push:
    branches: [main]
    paths:
      - engine/draft/live_state_consumer.py
      - tests/acceptance/test_live_state_consumer.py
      - engine/contracts/draft_seat_assignment.py
      - engine/draft/round_order_map.py
      - engine/draft_state/**
      - contracts/draft/spamml-2026-draft-seat-assignment-v1.1.yaml
      - contracts/league_rules/spamml-2026-v0.5.yaml
      - .github/workflows/issue23-live-state-consumer.yml

permissions:
  contents: read

jobs:
  acceptance:
    name: Issue #23 acceptance tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run Issue #23 acceptance suite and retain raw evidence
        id: focused_suite
        shell: bash
        run: |
          evidence_dir="issue23-live-state-consumer-evidence"
          mkdir -p "$evidence_dir"

          tested_commit_sha="$(git rev-parse HEAD)"
          runtime_consumer_blob_sha="$(git rev-parse "HEAD:engine/draft/live_state_consumer.py")"
          league_rules_blob_sha="$(git rev-parse "HEAD:contracts/league_rules/spamml-2026-v0.5.yaml")"
          workflow_blob_sha="$(git rev-parse "HEAD:.github/workflows/issue23-live-state-consumer.yml")"
          python_version="$(python --version 2>&1)"

          {
            echo "change_scope: tests and release evidence only"
            echo "tested_commit_sha: $tested_commit_sha"
            echo "runtime_consumer_blob_sha: $runtime_consumer_blob_sha"
            echo "league_rules_v0.5_blob_sha: $league_rules_blob_sha"
            echo "workflow_blob_sha: $workflow_blob_sha"
            echo "python_version: $python_version"
            echo 'install_command: python -m pip install --disable-pip-version-check -e ".[dev]"'
            echo "pytest_command: python -m pytest tests/acceptance/test_live_state_consumer.py -v"
          } > "$evidence_dir/provenance.txt"

          set +e
          python -m pytest tests/acceptance/test_live_state_consumer.py -v \
            2>&1 | tee "$evidence_dir/pytest-raw-output.txt"
          pytest_exit_code="${PIPESTATUS[0]}"
          set -e

          python - "$evidence_dir/pytest-raw-output.txt" <<'PY' \
            > "$evidence_dir/parser-derived-counts.txt"
          import re
          import sys
          from pathlib import Path

          output = Path(sys.argv[1]).read_text(encoding="utf-8")

          collected = re.search(r"collected (\d+) items?", output)

          def count(pattern: str) -> str:
              match = re.search(pattern, output)
              if match:
                  return match.group(1)
              return "0" if collected else "unavailable"

          print("counts_authority: parser-derived, non-authoritative")
          print(f"collected: {collected.group(1) if collected else 'unavailable'}")
          print(f"passed: {count(r'(\d+) passed')}")
          print(f"failed: {count(r'(\d+) failed')}")
          PY

          echo "pytest_exit_code: $pytest_exit_code" \
            >> "$evidence_dir/provenance.txt"
          echo "pytest_exit_code=$pytest_exit_code" >> "$GITHUB_OUTPUT"

      - name: Upload Issue #23 focused-suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue23-live-state-consumer-evidence
          path: issue23-live-state-consumer-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Preserve focused-suite failure status
        if: always()
        shell: bash
        run: exit "${{ steps.focused_suite.outputs.pytest_exit_code }}"
