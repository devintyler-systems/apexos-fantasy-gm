name: B-02 acceptance tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  acceptance:
    name: ticket-acceptance-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine relevant file changes
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(gh pr diff ${{ github.event.pull_request.number }} --name-only)
          else
            FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }})
          fi
          echo "Changed files:"
          echo "$FILES"
          if echo "$FILES" | grep -E '^(engine/canonical/|tests/acceptance/test_canonical_data_model\.py$|contracts/league_rules/)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.changed.outputs.relevant == 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.changed.outputs.relevant == 'true'
        run: pip install pytest pyyaml

      - name: Run B-02 acceptance tests
        if: steps.changed.outputs.relevant == 'true'
        run: python -m pytest tests/acceptance/test_canonical_data_model.py -q

      - name: No B-02-relevant changes
        if: steps.changed.outputs.relevant != 'true'
        run: echo "No B-02-relevant files changed on this ref; ticket-acceptance-tests passes trivially for B-02's portion."
