name: B-04 Draft Round Order Map

on:
  pull_request:
    branches:
      - main
    paths:
      - "engine/draft/**"
      - "tests/acceptance/test_draft_round_order_map.py"
      - "contracts/draft/**"
      - "contracts/league_rules/**"
      - "data/processed/draft_*_spamml_2026.*"
      - ".github/workflows/b04-draft-round-order-map.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: B-04 acceptance tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run B-04 acceptance suite
        run: python -m pytest tests/acceptance/test_draft_round_order_map.py -q
