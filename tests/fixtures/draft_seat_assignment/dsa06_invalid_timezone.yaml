artifact:
  name: spamml_2026_draft_seat_assignment
  version: "1.1"
  status: CONFIRMED_MANUAL_LEAGUE_STATE
  owner: Architect
  change_class: calibration
  created_at_utc: "2026-08-18T21:52:00Z"
  as_of_timestamp_utc: "2026-08-18T22:10:00Z"
  amends: contracts/draft/spamml-2026-draft-seat-assignment-v1.0.yaml
  amendment_note: >-
    Non-destructive amendment. v1.0 remains on record unmodified; this version resolves
    U02 (draft_date_time_utc) and U-DRAFT-02 (draft_clock_status) only. Seat assignments
    and manager resolution are unchanged from v1.0.
  canonical_league_rules_artifact: contracts/league_rules/spamml-2026-v0.4.yaml
  depends_on:
    - contracts/draft/draft-round-order-map-contract-v1.0.md
    - contracts/draft/draft-round-order-map-contract-v1.1-clarification.md
    - contracts/draft/draft-round-order-map-contract-v1.2-correction.md

identity:
  league_id: SPAMML
  season: 2026
  league_name: SPAMML
  manager_team_name: Professor FleX
  manager_draft_seat: 4

source_provenance:
  source_type: manual_league_manager_confirmation
  source_provider: league_operator
  source_reference: user-provided ordered draft-seat list
  retrieved_at_utc: "2026-08-18T02:46:00Z"
  effective_time_utc: null
  parser_version: manual-entry-v1
  canonical_identity_mapping_status: unambiguous
  notes:
    - "The manager team is Professor FleX at seat 4."
    - "Spam at seat 10 is a distinct participant and is not the manager team."
    - "Team names are displayed labels only; no platform account identity is asserted."

draft_date_time_provenance:
  source_type: manual_league_manager_confirmation
  source_provider: league_operator
  source_reference: "operator-supplied draft schedule: Monday, August 31, 2026, 6:00 PM Pacific (Chico, California)"
  retrieved_at_utc: "2026-08-18T21:52:00Z"
  effective_time_utc: "2026-09-01T01:00:00Z"
  timezone: "-07:00"
    # NORMATIVE: IANA timezone identifier is the durable source-of-record for this instant.
  utc_offset: "-07:00"
    # Observed offset at this instant (DST-active). Descriptive only; the IANA zone plus the
    # UTC instant above is what a parser must validate against, not this offset string.
  timezone_abbreviation: "PDT"
    # Descriptive/display-only abbreviation. Not a timezone identifier; do not parse against it.
  parser_version: manual-entry-v1

draft_state:
  format: non_standard_snake
    # NORMATIVE VALUE: matches contracts/league_rules/spamml-2026-v0.4.yaml `draft.format`
    # exactly (the sole approved format vocabulary for this league). This field is
    # informational passthrough only; the versioned Draft Round Order Map contract
    # (v1.0 + v1.1 + v1.2) remains the sole authority for deriving round/pick sequence
    # from seat and format. A consumer must not re-derive pick order from this string.
  league_size: 16
  draft_date_time_utc: "2026-09-01T01:00:00Z"
    # Equivalent to Monday, August 31, 2026, 6:00 PM America/Los_Angeles (PDT).
  draft_date_time_status: confirmed
  draft_clock_status: confirmed_untimed
    # NORMATIVE VALUE, aligned with contracts/league_rules/spamml-2026-v0.4.yaml's U03
    # resolution: draft_clock_config.timer_enabled: false. This field is informational
    # passthrough only; League Rules Contract v0.4 remains the sole clock-configuration
    # authority. A consumer must treat "confirmed_untimed" here and "timer_enabled: false"
    # there as one fact expressed in two artifacts, never as two independent facts that
    # could diverge.
  selection_state: not_started
    # Confirming draft_date_time_utc and draft_clock_status does NOT change selection_state.
    # See DSA-07: a real-time pick feed and an explicit state transition are required before
    # any live-draft claim, independent of how complete the schedule/clock data is.
  manual_entry_mode: permanent_primary_input

seat_assignments:
