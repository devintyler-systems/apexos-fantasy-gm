# SPAMML League Rules Contract
# Artifact: league_rules_contract
# Version: 0.5
# Owner: Devin Tyler
# Status: Partially Confirmed — see unknown_or_unconfirmed
# Season: 2026
# Last Updated: 2026-08-20
# Change Log:
#   v0.1 — Initial draft from launch session
#   v0.2 — Confirmed REC eligibility, D_O rules, draft format, platform
#   v0.3 — Resolved U03: SPAMML 2026 draft is UNTIMED (live draft, no clock).
#           Added reusable draft_clock_config schema supporting none/30s/60s/90s/120s
#           for future leagues with different pick-timer rules.
#   v0.4 — Resolved U02: draft.date_time confirmed as Monday, August 31, 2026, 6:00 PM
#           Pacific (America/Los_Angeles, PDT) = 2026-09-01T01:00:00Z. Noted U01 (2026
#           draft position) as resolved by a separate artifact
#           (contracts/draft/spamml-2026-draft-seat-assignment-v1.1.yaml), not duplicated
#           here to preserve single-source-of-truth for manager seat.
#   v0.5 — ADDITIVE, non-destructive amendment (C-02 remediation). Added machine-parseable
#           top-level `contract_version` field ("0.5"). All other fields byte-identical to
#           v0.4. engine/draft/round_order_map.py's _league_rules_version() must be updated
#           (separate Builder issue/PR) to read this parsed field directly; filename-derived
#           version inference (regex against the YAML filename) is deprecated as of this
#           version and must fail to a deterministic PROVENANCE_UNAVAILABLE state, never an
#           inferred value, if contract_version is missing or invalid on any future artifact.

league_id: spamml-2026
contract_version: "0.5"
league_name: SPAMML
season: 2026
platform:
  primary: custom_manual
  mirror: fantrax
  api_sync: none
league_size: 16

draft:
  format: non_standard_snake
  date_time: "2026-09-01T01:00:00Z"
    # Confirmed 2026-08-18 by league operator: Monday, August 31, 2026, 6:00 PM
    # America/Los_Angeles (PDT, UTC-7 active for this date). Equivalent UTC instant
    # shown here; PDT source-of-record preserved in the change log and in
    # contracts/draft/spamml-2026-draft-seat-assignment-v1.1.yaml's draft_date_time_provenance.
  draft_position_2026: unknown
    # See known_limitations: canonical value now lives in
    # contracts/draft/spamml-2026-draft-seat-assignment-v1.1.yaml (Professor FleX = seat 4).
    # Not duplicated here to avoid two competing sources of truth.
  trading_during_draft: unknown
  total_picks: 128
  draft_clock_config:
    timer_enabled: false
      # CONFIRMED: SPAMML 2026 is a live, untimed draft. There is no real pick
      # clock -- Devin confirmed "no real timer as it's a live draft."
    timer_seconds: null
      # null because timer_enabled is false. This field is populated only when
      # timer_enabled is true, using one of the values in available_timer_options_seconds.
    available_timer_options_seconds: [30, 60, 90, 120]
      # Reusable enum for FUTURE leagues that DO have a pick clock. Not used by
      # SPAMML 2026, but this schema is built once and reused across all ApexOS
      # leagues rather than being SPAMML-specific.
    ui_requirement: "League Rules Contract intake must present a timer selector
      with options: [No Timer, 30 sec, 1 min, 1 min 30 sec, 2 min] whenever a NEW
      league is configured. SPAMML 2026 has 'No Timer' selected."
  practical_impact_on_draft_recommendation_engine: "Since there is no real pick
    clock, the Live-Draft Degraded Mode Runbook's Section 6 pre-computation
    requirement is a UX convenience (faster decision support), not a hard
    performance gate for THIS league. RB03 (runbook risk item) is downgraded
    from MEDIUM to LOW for SPAMML 2026 specifically, though pre-computation
    remains implemented since it costs nothing and benefits any future timed league."

