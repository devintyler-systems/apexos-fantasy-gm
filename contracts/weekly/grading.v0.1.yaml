contract: weekly_grading
contract_version: "0.1"
inputs: [frozen run directory, nflverse stats_player_week, snap_counts, games]
join_key: [normalized player name, nflverse team code]
scope: only players with a recorded snap in a FINAL game
outputs: [grade.json, grade_players.csv]
metrics:
  per_market: [n, mae, bias, p25_p75_coverage]     # markets: rec_yds, rec, rush_yds, pass_yds, pass_cmp, pass_td, qb_rush_yds
  anytime_td: [n, brier, log_loss, sum_projected, actual_scorers]
  dk_points: [n, proj_mean, actual_mean, mae, bias_by_pos]       # players with projected DK points >= 8, no bonuses
  qb_rush_td: [n, sum_projected, actual_qbs_with_td]
  team_points: [n_games, rmse, total_bias, winner_hit_rate]
comparability: definitions mirror engine/weekly/compare_bt.py so live and backtest numbers are comparable.
promotion_rule: a model or calibration change is promoted only if the multi-season week 4-12 backtest beats the current baseline on rec_yds MAE and TD log loss and is no worse than 0.001 on rec MAE and team RMSE (amended 2026-10-14, DECISIONS #24: random-number noise between two runs is about 0.0005, and a change that cannot move receptions cannot be required to beat them).
promotion_rule_qb_only: (DECISIONS #59, owner-approved 2026-10-27) a change that touches only the quarterback passing layer (qb_share, qb_td, QB passing dispersion) is promoted if the multi-season week 4-12 backtest lowers passing-yards MAE and pinball loss in the pooled sample and in at least two of three seasons, is no worse than 0.05 on completions MAE, and leaves rec_yds MAE, rec MAE, TD log loss and team RMSE unchanged to within 0.001 (eval_qb.py and eval_candidate.py).
promotion_rule_noise_aware: >-
  (DECISIONS #69, owner-approved 2026-11-19) Supersedes the fixed 0.001 tolerances of promotion_rule, which sit below the backtest's random-number noise
  (#68: a baseline re-run with only APEX_SEED changed moved pooled team RMSE 0.016 and TD log loss 0.0015).
  Run the multi-season weeks 4-12 backtest for baseline and candidate on two seeds (default 20261004 and APEX_SEED=777).
  Noise floor per metric = the largest |pooled delta| over the three pairs of three baseline seeds (20261004, 777, 999; DECISIONS #70: one pair under-stated rush_yds noise 6x).
  Promote only if (1) rec_yds MAE improves by more than 2x its noise floor on BOTH seeds, and (2) for rec MAE, rush_yds MAE,
  rush_att MAE, TD log loss and team RMSE, the mean of the two seeds' pooled deltas is not worse than 2x that metric's noise floor.
  Re-measure the noise floor whenever the baseline changes. Floors measured 2026-11-19 (baseline = #66): rec_yds 0.0064, rec 0.0005,
  rush_yds 0.0413, rush_att 0.0029, td_ll 0.0015, team_rmse 0.0161.
  Floors measured 2026-11-20 (baseline = #66 + #69, three seeds): rec_yds 0.0181, rec 0.0013, rush_yds 0.0352, rush_att 0.0064, td_ll 0.0011.
  Floors measured 2026-11-24 (baseline = #66 + #69 + #70 + #71 + #75 rush form 0.40, three seeds): rec_yds 0.0108, rec 0.0020, rush_yds 0.0922, rush_att 0.0060, td_ll 0.0018, team_rmse 0.0074, rush_pinball 0.0249, rush_iqr_coverage 0.0031.
promotion_rule_dispersion_only: >-
  (DECISIONS #75, owner-approved 2026-11-24) A change that leaves projected means unchanged and only widens or narrows a distribution is promoted if, on the multi-season weeks 4-12 backtest on two seeds:
  (1) the quantile pinball loss of the targeted market (quantiles 10, 25, 75, 90 from the backtest tables) improves by more than 2x its noise floor on BOTH seeds,
  (2) the targeted P25-P75 coverage ends within 3 points of 50% and both tails (below P10, above P90) within 2 points of 10%, and
  (3) rec_yds MAE, rec MAE, rush_yds MAE, rush_att MAE, TD log loss and team RMSE are each no worse than 2x their noise floor on the mean of the two seeds.
  Noise floors are measured on the baseline (largest |delta| over the three pairs of three seeds); re-measure after every promotion, because a dispersion change adds sampling noise to the metrics it touches.
